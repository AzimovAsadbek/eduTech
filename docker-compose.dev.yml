# Local development: only the database. Run the app with `npm run dev`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: edutech-dev-db
    environment:
      POSTGRES_USER: edutech
      POSTGRES_PASSWORD: edutech
      POSTGRES_DB: edutech
    ports:
      - "5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
volumes:
  pgdata-dev:
